name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Path for https://iesb.com.my/smks3
          # If FTP already lands in public_html, change to: smks3/
          # Or set secret FTP_SERVER_DIR and use: ${{ secrets.FTP_SERVER_DIR }}
          server-dir: public_html/smks3/
          local-dir: ./
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env
            .env.*
            !.env.example
            README.md
            app/README.md
            **/.DS_Store
            **/Thumbs.db
            storage/rate_limit/**
            !storage/rate_limit/.gitkeep

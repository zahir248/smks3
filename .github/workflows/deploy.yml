name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          # Must be the cPanel server IP (110.4.45.113), NOT iesb.com.my
          # (domain is behind Cloudflare — FTP to the domain will time out)
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # FTP account Directory is already /home/iesbcomm/public_html/smks3
          server-dir: ./
          local-dir: ./
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env
            .env.*
            !.env.example
            README.md
            app/README.md
            **/.DS_Store
            **/Thumbs.db
            storage/rate_limit/**
            !storage/rate_limit/.gitkeep
